<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style\style.css">
    <title>DC_Formação</title>
</head>
<body>
    <main>
        <h1>Formulário de inscrição nas UFCD's</h1>
        <section class="formulario">
            <form id="formInscricao" action="#" method="post">
                <legend>Dados Pessoais:</legend>
                <label for="nome">Nome:</label>
                <input type="text" name="nome" id="nome" required>
                <label for="morada">Morada:</label>
                <input type="text" name="morada" id="morada" required>
                <label for="contato">Contato:</label>
                <input type="tel" name="contato" id="contato" required>
                <label for="email">Email:</label>
                <input type="email" name="email" id="email" required>
                <label for="data_nasc">Data Nascimento:</label>
                <input type="date" name="data_nasc" id="data_nasc" required>
                <label for="habilitacoes">Habilitações Literárias</label>
                <input type="text" name="habilitacoes" id="habilitacoes" required>

                <legend>Documentos necessários:</legend>
                <label for="declaracaoPatronal">Declaração da Entidade Patronal:</label>
                <input type="file" name="habilitacoes" id="habilitacoes" accept=".pdf, .jpg, .png" required>

                <input type="submit" value="Enviar">
            </form>

        </section>
    </main>
</body>
</html>
